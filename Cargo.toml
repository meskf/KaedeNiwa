[workspace]
resolver = "3"
members = [
    "crates/kaede-protocol",
    "crates/kaede-crypto",
    "crates/kaede-mls",
    "crates/kaede-storage",
    "crates/kaede-client",
    "crates/kaede-server",
    "crates/kaede-ui",
    "crates/kaede-wasm",
    "crates/kaede-desktop",
    "crates/kaede-mobile",
    "crates/kaede-admin",
    "crates/kaede-capture",
    "crates/kaede-media",
    "crates/kaede-media-session",
    "crates/kaede-livekit-web",
]

[workspace.package]
version      = "0.0.2"
edition      = "2024"
rust-version = "1.99"
license      = "MIT OR Apache-2.0"

[workspace.dependencies]
# internal
kaede-protocol = { path = "crates/kaede-protocol", version = "0.0.2" }
kaede-crypto   = { path = "crates/kaede-crypto", version = "0.0.2" }
kaede-mls      = { path = "crates/kaede-mls", version = "0.0.2" }
kaede-storage  = { path = "crates/kaede-storage", version = "0.0.2" }
kaede-client   = { path = "crates/kaede-client", version = "0.0.2" }
kaede-ui       = { path = "crates/kaede-ui", version = "0.0.2" }
kaede-livekit-web = { path = "crates/kaede-livekit-web", version = "0.0.2" }

# serialization
serde    = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
ciborium = "0.2"

# crypto
hkdf             = "0.12"
sha2             = "0.10"
aes-gcm          = "0.10"
zeroize          = { version = "1", features = ["derive"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
subtle           = "2"

# mls
openmls             = "0.9"
openmls_rust_crypto = "0.6"
openmls_traits      = "0.6"

# server
axum               = "0.8"
tokio              = { version = "1", features = ["full"] }
# 必须启用 rustls，否则 wss:// 在生产环境直接失败（默认特性只支持 ws://）。
# 同时避免 native-tls/OpenSSL，便于 Android 交叉编译。
tokio-tungstenite  = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
rustls             = "0.23"
rustls-pemfile     = "2"
sqlx               = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
argon2             = "0.5"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow             = "1"
thiserror          = "2"

# dioxus
dioxus         = "0.7"
dioxus-web     = "0.7"
dioxus-desktop = "0.7"

# wasm
wasm-bindgen             = "0.2"
wasm-bindgen-futures     = "0.4"
js-sys                   = "0.3"
console_error_panic_hook = "0.1"
tracing-wasm             = "0.2"

# async
async-trait = "0.1"

# ============================================================
# Profiles
# ============================================================

# 通用 release：优先速度，体积其次（服务器 / Desktop）
[profile.release]
opt-level       = 3
lto             = "thin"
codegen-units   = 1
panic           = "unwind"
strip           = true
overflow-checks = false

# P1-3：crypto 数学依赖无回绕，强制开溢出检查
[profile.release.package."kaede-crypto"]
overflow-checks = true

# WASM release：优先体积（Web）
# 实测从 2.8MB → 1.68MB（-39.9%）
[profile.release-wasm]
inherits      = "release"
opt-level     = "z"
lto           = "fat"
codegen-units = 1
panic         = "abort"
# 必须关闭：LLVM 23 起 cargo 的 strip 会移除 `__wasm_bindgen_unstable`
# 自定义段，导致 dx / wasm-bindgen 无法处理链接产物（打包直接失败）。
# 体积由 dx 后续的 wasm-opt 负责。
strip         = false

# 通用 dev：快编译，保留 debug 信息
[profile.dev]
opt-level = 1

# WASM dev：快编译，体积不关心
[profile.dev-wasm]
inherits  = "dev"
opt-level = "s"

[profile.dev.package."*"]
opt-level = 2

