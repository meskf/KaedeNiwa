appId: com.kaedeniwa.desktop
productName: KaedeNiwa
copyright: Copyright © 2026 KaedeNiwa

directories:
  output: ../../release/desktop
  buildResources: build

files:
  - src/**/*
  - package.json

extraResources:
  - from: ../web/dist
    to: web

asar: true

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  artifactName: KaedeNiwa-${version}-setup.${ext}
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: KaedeNiwa
  deleteAppDataOnUninstall: false

portable:
  artifactName: KaedeNiwa-${version}-portable.${ext}
