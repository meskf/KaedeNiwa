name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: kaede-server-linux-x86_64
            livekit_pattern: "*linux*amd64*.tar.gz"
            binary_name: kaede-server
            livekit_bin: livekit-server
          - os: windows-latest
            artifact_name: kaede-server-windows-x86_64
            livekit_pattern: "*windows*amd64*.zip"
            binary_name: kaede-server.exe
            livekit_bin: livekit-server.exe
          - os: macos-13
            artifact_name: kaede-server-macos-x86_64
            livekit_pattern: "*darwin*amd64*.tar.gz"
            binary_name: kaede-server
            livekit_bin: livekit-server

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          targets: wasm32-unknown-unknown

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Install keyring deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev

      - name: Build Frontend
        working-directory: apps/web
        run: |
          npm ci
          npm run build:wasm
          npm run build

      - name: Build Server (embed-web)
        run: cargo build -p kaede-server --release --features embed-web --locked

      - name: Download LiveKit
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $pattern = "${{ matrix.livekit_pattern }}"
          $dlDir = "$env:RUNNER_TEMP/livekit-dl"
          New-Item -ItemType Directory -Force -Path $dlDir
          
          Write-Host "Downloading LiveKit matching pattern: $pattern"
          gh release download -R livekit/livekit -p $pattern -D $dlDir --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }
          
          $archive = Get-ChildItem -Path $dlDir | Select-Object -First 1
          if (-not $archive) {
              Write-Error "Archive not found after download!"
              exit 1
          }
          
          $extractDir = "$env:RUNNER_TEMP/livekit-extracted"
          New-Item -ItemType Directory -Force -Path $extractDir
          
          if ($archive.Name -match "\.zip$") {
              Expand-Archive -Path $archive.FullName -DestinationPath $extractDir
          } else {
              tar -xzf $archive.FullName -C $extractDir
          }
          
          # 在解压出的文件里寻找 livekit 的可执行文件，无视具体名字，强行重命名
          $foundExe = Get-ChildItem -Path $extractDir -Recurse -File | Where-Object { 
              $_.Name -match "livekit" -and $_.Name -notmatch "\.(md|txt|json|yaml|yml)$" 
          } | Select-Object -First 1
          
          if ($foundExe) {
              $targetName = "${{ matrix.livekit_bin }}"
              $targetPath = Join-Path $extractDir $targetName
              if ($foundExe.FullName -ne $targetPath) {
                  Copy-Item $foundExe.FullName -Destination $targetPath -Force
                  Write-Host "Successfully renamed $($foundExe.Name) to $targetName"
              } else {
                  Write-Host "$targetName is already in place"
              }
              # 在 Linux/Mac 上需要赋予可执行权限
              if ("${{ runner.os }}" -ne "Windows") {
                  chmod +x $targetPath
              }
          } else {
              Write-Error "Could not find livekit executable in extracted files!"
              exit 1
          }

      - name: Package Release Zip
        shell: pwsh
        run: |
          $dist = "kaede-${{ github.ref_name }}-${{ matrix.os }}"
          New-Item -ItemType Directory -Force -Path $dist
          
          Copy-Item "target/release/${{ matrix.binary_name }}" -Destination "$dist/"
          
          $livekitPath = Join-Path "$env:RUNNER_TEMP/livekit-extracted" "${{ matrix.livekit_bin }}"
          if (Test-Path $livekitPath) {
              Copy-Item $livekitPath -Destination "$dist/"
          } else {
              Write-Error "LiveKit binary not found in extract folder!"
              exit 1
          }
          
          $readme = @"
          KaedeNiwa Server ${{ github.ref_name }}
          
          How to run:
          1. Double-click kaede-server (or ./kaede-server in terminal).
          2. Open your browser to http://127.0.0.1:18080
          
          Note: LiveKit server is bundled in this folder. The main server will automatically spawn it on port 7880.
          "@
          Set-Content -Path "$dist/README.txt" -Value $readme
          
          Compress-Archive -Path "$dist/*" -DestinationPath "${{ matrix.artifact_name }}.zip"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}.zip
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
