name: CI

on:
  push:
    branches: [main]
  pull_request:

# 最小权限：CI 只需要读仓库。新增 job 若需写权限请单独声明。
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # 保守值：webrtc-sys / tao 在多核并发编译时偶发元数据竞争
  CARGO_BUILD_JOBS: "4"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy-core:
    name: clippy (core crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: install keyring deps (Linux Secret Service)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev
      - name: clippy core
        run: >-
          cargo clippy
          -p kaede-protocol
          -p kaede-crypto
          -p kaede-storage
          -p kaede-mls
          -p kaede-client
          -p kaede-server
          --all-targets
          -- -D warnings

  clippy-full:
    name: clippy (full workspace, informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: install webrtc/gstreamer deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake clang libclang-dev \
            libssl-dev libx11-dev libxext-dev libxfixes-dev \
            libgl1-mesa-dev libgbm-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libdbus-1-dev
      - name: clippy full
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - kaede-protocol
          - kaede-crypto
          - kaede-storage
          - kaede-mls
          - kaede-client
          - kaede-server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: install keyring deps (Linux Secret Service)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev
      - run: cargo nextest run -p ${{ matrix.crate }} --no-fail-fast

  e2e-client:
    name: e2e (kaede-client --features native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: install keyring deps (Linux Secret Service)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev
      - run: cargo nextest run -p kaede-client --features native --test room_e2e --no-fail-fast

  check-wasm:
    name: check (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: check kaede-wasm (end-to-end wasm)
        run: cargo check -p kaede-wasm --target wasm32-unknown-unknown
      - name: check kaede-client (wasm feature)
        run: cargo check -p kaede-client --features wasm --target wasm32-unknown-unknown

  check-windows:
    name: check (windows, core crates)
    runs-on: windows-latest
    env:
      # webrtc-sys 在 Windows 多核并发编译时偶发 MSVC C1060（编译器堆空间不足）
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
      - name: check core crates
        run: >-
          cargo check
          -p kaede-protocol
          -p kaede-crypto
          -p kaede-storage
          -p kaede-mls
          -p kaede-client
          -p kaede-server
          --all-targets

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v1
        with:
          command: check