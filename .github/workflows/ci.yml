name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  check:
    name: cargo check (core crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: install keyring deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev
      - name: check core crates
        run: >-
          cargo check
          -p kaede-protocol
          -p kaede-crypto
          -p kaede-storage
          -p kaede-mls
          -p kaede-client
          -p kaede-server
          --all-targets

  clippy:
    name: clippy (core crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: install keyring deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev
      - name: clippy core
        run: >-
          cargo clippy
          -p kaede-protocol
          -p kaede-crypto
          -p kaede-storage
          -p kaede-mls
          -p kaede-client
          -p kaede-server
          --all-targets
          -- -D warnings

  test:
    name: test (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - kaede-protocol
          - kaede-crypto
          - kaede-storage
          - kaede-mls
          - kaede-client
          - kaede-server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: install keyring deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev
      - run: cargo nextest run -p ${{ matrix.crate }} --no-fail-fast

  fuzz-build:
    name: cargo-fuzz build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - name: fuzz build
        working-directory: crates/kaede-protocol/fuzz
        run: cargo +nightly fuzz build

  typecheck-web:
    name: typecheck (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci || npm install
      - run: npm run typecheck

  e2e:
    name: e2e (headless)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install keyring deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev
      - name: install wasm-pack
        run: cargo install wasm-pack --locked
      - name: install playwright
        working-directory: apps/web
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium
      - name: install livekit-server
        run: |
          curl -sSL https://github.com/livekit/livekit/releases/download/v1.9.1/livekit_1.9.1_linux_amd64.tar.gz | tar xz
          mkdir -p tools/livekit
          mv livekit-server tools/livekit/
      - name: build wasm
        working-directory: apps/web
        run: npm run build:wasm
      - name: build server
        run: cargo build -p kaede-server --release
      - name: run e2e (test-1 to test-10)
        working-directory: apps/web
        env:
          KAEDE_HEADLESS: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          # 起 LiveKit
          ../../tools/livekit/livekit-server --dev &
          sleep 3
          # 起 backend
          KAEDE_BIND=0.0.0.0:18080 \
          LIVEKIT_API_KEY=devkey \
          LIVEKIT_API_SECRET=secret \
          LIVEKIT_WS_URL=ws://127.0.0.1:7880 \
          RUST_LOG=info \
          ../../target/release/kaede-server &
          sleep 5
          # 起 vite (dev)
          npm run dev &
          sleep 8
          # 跑测试（不含 media + 不带 msedge channel）
          for t in test-1-auto-join test-2-channel-isolation test-3-reconnect test-12-multi-tab test-13-pending-queue; do
            echo "=== $t ==="
            node $t.cjs || exit 1
          done
