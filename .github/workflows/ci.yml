name: CI

on:
  push:
    branches: [main, ui-rewrite]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: rustfmt
      - run: cargo fmt --all -- --check

  check:
    name: cargo check (core crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
      - name: install keyring deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev
      - name: check core crates
        run: >-
          cargo check
          -p kaede-protocol
          -p kaede-crypto
          -p kaede-storage
          -p kaede-mls
          -p kaede-client
          -p kaede-server
          --all-targets

  clippy:
    name: clippy (core crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: install keyring deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev
      - name: clippy core
        run: >-
          cargo clippy
          -p kaede-protocol
          -p kaede-crypto
          -p kaede-storage
          -p kaede-mls
          -p kaede-client
          -p kaede-server
          --all-targets
          -- -D warnings

  test:
    name: test (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - kaede-protocol
          - kaede-crypto
          - kaede-storage
          - kaede-mls
          - kaede-client

          - kaede-server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: install keyring deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev
      - run: cargo nextest run -p ${{ matrix.crate }} --no-fail-fast

  fuzz-build:
    name: cargo-fuzz build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - name: fuzz build
        working-directory: crates/kaede-protocol/fuzz
        run: cargo +nightly fuzz build

  typecheck-web:
    name: typecheck (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: install wasm-pack
        run: cargo install wasm-pack --locked
      - name: npm ci
        working-directory: apps/web
        run: npm ci
      - name: build wasm
        working-directory: apps/web
        run: npm run build:wasm
      - name: typecheck
        working-directory: apps/web
        run: npm run typecheck

  # e2e: 暂时关闭。原因：14 个 test-*.cjs 硬编码 headless:false + channel:msedge，
  # Linux CI 没有 msedge 会直接失败。下一轮批量改成读 KAEDE_HEADLESS 环境变量后再开。
  e2e:
    name: e2e (headless)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: install wasm-pack
        run: cargo install wasm-pack --locked
      - name: install keyring deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev
      - name: npm ci
        working-directory: apps/web
        run: npm ci
      - name: install playwright chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: build wasm
        working-directory: apps/web
        run: npm run build:wasm
      - name: build server (release, dev-mode)
        run: cargo build -p kaede-server --release --features dev-mode
      - name: run e2e (non-media, headless)
        working-directory: apps/web
        env:
          KAEDE_HEADLESS: "1"
          KAEDE_SKIP_LIVEKIT_CHECK: "1"
        run: |
          set -e
          # start backend on 18080
          KAEDE_BIND=0.0.0.0:18080 \
          LIVEKIT_API_KEY=devkey \
          LIVEKIT_API_SECRET=secret \
          LIVEKIT_WS_URL=ws://127.0.0.1:7880 \
          RUST_LOG=info \
          ../../target/release/kaede-server > /tmp/backend.log 2>&1 &
          BACKEND_PID=$!
          # start vite on 5173
          npx vite --host 127.0.0.1 --port 5173 > /tmp/vite.log 2>&1 &
          VITE_PID=$!
          trap "kill $BACKEND_PID $VITE_PID 2>/dev/null || true" EXIT
          # wait for ports
          wait_port() {
            local port=$1
            local i=0
            while ! (echo > /dev/tcp/127.0.0.1/$port) 2>/dev/null; do
              i=$((i+1))
              if [ $i -ge 60 ]; then
                echo "port $port timeout"
                echo "=== backend.log ==="; tail -40 /tmp/backend.log
                echo "=== vite.log ==="; tail -40 /tmp/vite.log
                return 1
              fi
              sleep 1
            done
            echo "port $port ready"
          }
          wait_port 18080
          wait_port 5173
          # run tests
          for t in test-1-auto-join test-2-channel-isolation test-3-reconnect test-12-multi-tab test-13-pending-queue test-14-dm-wasm; do
            echo "===== $t ====="
            node $t.cjs
          done
