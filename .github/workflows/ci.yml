name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: rustfmt
      - run: cargo fmt --all -- --check

  check:
    name: cargo check (core crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
      - name: install keyring deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev
      - name: check core crates
        run: cargo check -p kaede-protocol -p kaede-crypto -p kaede-storage -p kaede-mls -p kaede-client -p kaede-server --all-targets --locked

  test:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
      - name: install keyring deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev
      # 分两段跑的原因：
      # 1) kaede-client 的 native 集成测试（channel_b2/dm_b2/room_e2e）由
      #    #![cfg(feature = "native")] 门控，默认 features 下整个文件是空 crate，
      #    cargo test 会显示 "running 0 tests" 且静默通过。必须显式 --features native。
      # 2) kaede-client-wasm 只能 wasm32 编译，host 下无法测试，必须排除。
      - name: test (workspace, excl. client & client-wasm)
        run: |
          cargo test --workspace --exclude kaede-client --exclude kaede-client-wasm --all-targets
      - name: test (kaede-client native integration)
        run: |
          cargo test -p kaede-client --features native --all-targets

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: install wasm-pack
        run: cargo install wasm-pack --locked
      - name: install keyring deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev
      - name: npm ci
        working-directory: apps/web
        run: npm ci
      - name: install playwright chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium chromium-headless-shell
      - name: build wasm
        working-directory: apps/web
        run: npm run build:wasm
      - name: build server (dev-mode, debug)
        # 必须与 playwright.config.ts 里 webServer 的 `cargo run` profile 一致，
        # 否则 cargo run 会重新编译一遍，e2e job 白等几分钟。
        run: cargo build -p kaede-server --features dev-mode
      
      # 服务由 playwright.config.ts 的 webServer 自动拉起：
      # 本地与 CI 共用同一份启动/探活/清理逻辑，避免两套代码漂移。
      # CI 下 reuseExistingServer=false，由 Playwright 负责启停。
      - name: run Playwright E2E
        working-directory: apps/web
        env:
          KAEDE_HEADLESS: "1"
          KAEDE_HTTP: "1"
        run: npx playwright test --reporter=list

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # TODO(v0.2): remove continue-on-error once baseline warnings are cleared.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: install keyring deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev
      - name: clippy (workspace, excl. client-wasm)
        run: cargo clippy --workspace --exclude kaede-client-wasm --all-targets --locked -- -D warnings
      - name: clippy (kaede-client native)
        run: cargo clippy -p kaede-client --features native --all-targets --locked -- -D warnings

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  release-build:
    name: cargo build --release (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
      - name: install keyring deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev
      - name: cargo build --release
        run: cargo build --release --locked -p kaede-server
