# 项目级 cargo 配置。
# 全局镜像在 ~/.cargo/config.toml。

[alias]
ck     = "check --workspace --all-targets"
cb     = "build --workspace"
cbr    = "build --workspace --profile release-wasm"
ct     = "test --workspace"
ct1    = "test --workspace -- --test-threads=1"
cf     = "fmt --all"
cc     = "clippy --workspace --exclude kaede-client-wasm --all-targets -- -D warnings"
cwasm  = "check -p kaede-client-wasm --target wasm32-unknown-unknown"
cwd    = "check -p kaede-client-wasm --target wasm32-unknown-unknown"
ctall  = "test --workspace --exclude kaede-client-wasm --all-targets"
ctnative = "test -p kaede-client --features native --all-targets"

# ============================================================
# Windows target 配置
# ============================================================
# LiveKit 的 libwebrtc-sys 使用静态 CRT (/MT)，
# Rust 默认使用动态 CRT (/MD)，必须统一为静态。
# 参考: https://github.com/livekit/rust-sdks/issues/364
[target.'cfg(windows)']
rustflags = ["-C", "target-feature=+crt-static"]

# ============================================================
# WASM target 配置
# ============================================================
[target.wasm32-unknown-unknown]
# getrandom 0.3+ 需要 cfg 指定 wasm backend
# 见 https://docs.rs/getrandom/#webassembly-support
rustflags = [
    '--cfg', 'getrandom_backend="wasm_js"',
]

# ============================================================
# 开发环境变量
# ============================================================
[env]
# Rust 1.95+ metadata 分离，wasm 增量缓存损坏时报 "only metadata stub found"
# 强制嵌入 rlib 回到旧行为
CARGO_UNSTABLE_EMBED_METADATA = "true"
