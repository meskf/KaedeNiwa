[package]
license.workspace = true
name = "kaede-mls"
version.workspace = true
edition.workspace = true

[features]
default = ["memory-storage"]
wasm = []
native = []
memory-storage = ["dep:openmls_memory_storage"]

[dependencies]
kaede-crypto   = { workspace = true }
kaede-protocol = { workspace = true }
kaede-storage  = { workspace = true }
thiserror      = { workspace = true }
zeroize        = { workspace = true }

openmls = { workspace = true, features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_rust_crypto    = { workspace = true }
openmls_traits         = { workspace = true }
openmls_memory_storage = { version = "0.6", optional = true }
tls_codec              = "0.5"




[target.'cfg(target_arch = "wasm32")'.dependencies]
openmls = { workspace = true, features = ["draft-ietf-mls-pq-ciphersuites"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }


