[package]
license.workspace = true
name = "kaede-server"
version.workspace = true
edition.workspace = true

[[bin]]
name = "kaede-server"
path = "src/main.rs"

[lib]
name = "kaede_server"
path = "src/lib.rs"

[dependencies]
kaede-protocol = { workspace = true }
kaede-mls      = { workspace = true }

anyhow             = { workspace = true }
axum               = { workspace = true, features = ["ws", "macros"] }
tokio              = { workspace = true }
sqlx               = { workspace = true, features = ["migrate"] }
argon2             = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
serde              = { workspace = true }
serde_json         = "1"
ciborium           = { workspace = true }
thiserror          = { workspace = true }
base64             = "0.22"
hmac               = "0.12"
sha2               = { workspace = true }
subtle             = { workspace = true }
rand               = "0.8"
futures-util       = "0.3"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
ipnet              = "2"
# LiveKit RoomService 管理 API（踢人/回收媒体会话）。必须 rustls-tls：
# 生产 LiveKit 走 wss/https，且服务端不使用 OpenSSL（与 Android 交叉编译约定一致）。
reqwest            = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tokio-tungstenite = { workspace = true }
tokio             = { workspace = true }
futures-util      = "0.3"
# reqwest 由 [dependencies] 提供（含 json + rustls-tls），测试直接复用。
serde_json        = "1"

[features]
default = []
dev-mode = []
