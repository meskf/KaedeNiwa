# cargo-deny 配置（0.20 语法）。
# P0-2：0.20 把 unmaintained / unsound 从 "warn"|"deny" 改为 scope 枚举。
# P0-2：[licenses] allow = [] 会拒绝所有有 license 的 crate（Rust 生态 99% 是 MIT/Apache）。

[advisories]
yanked = "warn"
unmaintained = "workspace"
unsound = "workspace"
ignore = [
    # zip 0.6.6：webrtc-sys-build 的 build-only 依赖，输入是 GitHub 官方 release，
    # 3 条 advisory 都需要解压 attacker-controlled ZIP 才能触发，本项目不成立。
    { id = "RUSTSEC-2026-0367", reason = "zip build-only (webrtc-sys-build), trusted input" },
    { id = "RUSTSEC-2026-0368", reason = "zip build-only (webrtc-sys-build), trusted input" },
    { id = "RUSTSEC-2026-0369", reason = "zip build-only (webrtc-sys-build), trusted input" },
]

[licenses]
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0",
    "Zlib", "MPL-2.0", "CC0-1.0", "Unlicense", "BSL-1.0",
    "NCSA", "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
