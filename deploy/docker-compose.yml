# KaedeNiwa 单机部署：signaling server + Caddy（TLS / 静态站）
#
#   1. cp deploy/.env.example deploy/.env 并填写
#   2. 构建 Web：pwsh -File scripts/bundle.ps1 web  → dist/web
#   3. docker compose -f deploy/docker-compose.yml up -d --build
#
# LiveKit 不在此文件内：它需要独立的 UDP 端口与生产配置。
# 把 LIVEKIT_WS_URL 指向你的 LiveKit 实例（建议 wss://）。
services:
  kaede:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - .env
    environment:
      KAEDE_BIND: 0.0.0.0:8080
      KAEDE_DB: sqlite:///var/lib/kaede/kaede.db?mode=rwc
    expose:
      - "8080"
    volumes:
      - kaede-data:/var/lib/kaede
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/ready"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    depends_on:
      kaede:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Caddyfile 使用 {$KAEDE_DOMAIN}
      KAEDE_DOMAIN: ${KAEDE_DOMAIN:?set KAEDE_DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../dist/web:/srv/kaede:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  kaede-data:
  caddy-data:
  caddy-config:
