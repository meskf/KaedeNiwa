# KaedeNiwa 单机部署：signaling server + Caddy（TLS / 静态站）
#
#   1. cp deploy/.env.example deploy/.env 并填写
#   2. 构建 Web：pwsh -File scripts/bundle.ps1 web  → dist/web
#   3. docker compose -f deploy/docker-compose.yml up -d --build
#
# LiveKit 不在此文件内：它需要独立的 UDP 端口与生产配置。
# 把 LIVEKIT_WS_URL 指向你的 LiveKit 实例（建议 wss://）。
services:
  kaede:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - .env
    environment:
      KAEDE_BIND: 0.0.0.0:18080
      KAEDE_DB: sqlite:///var/lib/kaede/kaede.db?mode=rwc
      # 附件、备份等运行时数据的根目录（位于可写卷内）。
      KAEDE_DATA_DIR: /var/lib/kaede/data
      # 容器内反向代理来自 Docker bridge，必须显式信任该网段，
      # 否则所有用户会被归并成同一个代理 IP（登录失败计数全站共享）。
      # 网段固定为下方 kaede-net 的 subnet，避免默认信任整个 172.16.0.0/12。
      KAEDE_TRUSTED_PROXIES: ${KAEDE_TRUSTED_PROXIES:-172.28.0.0/16}
    expose:
      - "18080"
    volumes:
      - kaede-data:/var/lib/kaede
    networks:
      - kaede-net
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18080/ready"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    depends_on:
      kaede:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Caddyfile 使用 {$KAEDE_DOMAIN}
      KAEDE_DOMAIN: ${KAEDE_DOMAIN:?set KAEDE_DOMAIN in deploy/.env}
      # Caddyfile 的 upstream；必须显式指向 compose 内的 kaede 服务。
      KAEDE_UPSTREAM: kaede:18080
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../dist/web:/srv/kaede:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    networks:
      - kaede-net

volumes:
  kaede-data:
  caddy-data:
  caddy-config:

networks:
  kaede-net:
    ipam:
      config:
        # 固定网段：与 KAEDE_TRUSTED_PROXIES 默认值保持一致。
        - subnet: 172.28.0.0/16
