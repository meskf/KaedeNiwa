services:
  kaede:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - .env
    environment:
      KAEDE_BIND: 0.0.0.0:18080
      KAEDE_DB: sqlite:///var/lib/kaede/kaede.db?mode=rwc
      KAEDE_DATA_DIR: /var/lib/kaede/data
      KAEDE_TRUSTED_PROXIES: ${KAEDE_TRUSTED_PROXIES:-172.28.0.0/16}
      # 强制指定内部 LiveKit 地址
      LIVEKIT_WS_URL: ws://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: 12345678901234567890123456789012
    expose:
      - "18080"
    volumes:
      - kaede-data:/var/lib/kaede
    networks:
      - kaede-net
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18080/ready"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7881:7881"         # WebRTC TCP
      - "7882:7882/udp"     # WebRTC UDP
    networks:
      - kaede-net
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      kaede:
        condition: service_healthy
    # 本地测试临时用 8080/8443，防止被 Steam++ 等占用。生产环境请改回 "80:80" 和 "443:443"
    ports:
      - "80:80" 
      - "443:443"
    environment:
      KAEDE_DOMAIN: ${KAEDE_DOMAIN:?set KAEDE_DOMAIN in deploy/.env}
      KAEDE_UPSTREAM: kaede:18080
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../dist/web:/srv/kaede:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    networks:
      - kaede-net

volumes:
  kaede-data:
  caddy-data:
  caddy-config:

networks:
  kaede-net:
    ipam:
      config:
        - subnet: 172.28.0.0/16


