# KaedeNiwa Nginx 反向代理样例
#
# 适用：现有 Nginx 站点；静态站来自 dist/web。
# 证书路径按实际修改（certbot / 商业证书均可）。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name kaede.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name kaede.example.com;

    ssl_certificate     /etc/letsencrypt/live/kaede.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kaede.example.com/privkey.pem;

    # 附件上限 32 MiB + CBOR/JSON 包装余量；需大于服务端 34 MiB。
    client_max_body_size 36m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    # 纵深防御：Web 端快照密钥有公开信息回退方案；CSP 抵御 XSS/扩展读取 IndexedDB。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; object-src 'none'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self' wss: https:; base-uri 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=(), notifications=()" always;

    # 指标只给本机 Prometheus。
    location = /metrics {
        return 404;
    }

    location /ws {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 客户端有心跳，服务端 5 分钟无消息会断开；这里放宽读超时。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 32 MiB 附件在慢链路上很容易超过默认 60s，避免上传到一半 504。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:18080;
    }

    location = /ready {
        proxy_pass http://127.0.0.1:18080;
    }

    # SPA（dx bundle 产物在 dist/web/public）
    location / {
        root /srv/kaede/public;
        try_files $uri /index.html;
    }
}
