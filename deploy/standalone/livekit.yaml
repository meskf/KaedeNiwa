port: 7880
rtc:
  tcp_port: 7881
  # 用 udp_port 而非 port_range_start==port_range_end：
  # 后者在 LiveKit 1.13.x 会 panic（invalid argument to Intn）。
  udp_port: 7882
  use_external_ip: false
logging:
  level: info
  json: false
room:
  auto_create: true
keys:
  # 至少 32 位；修改时必须同步修改 start-kaede.ps1 的 LIVEKIT_API_SECRET。
  devkey: 12345678901234567890123456789012
webhook:
  api_key: devkey
  urls:
    - http://127.0.0.1:18080/api/livekit/webhook
